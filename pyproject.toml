[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AudioBookSlides"
version = "1.1.0"
description = "Create an AI generated video slideshow from an audiobook."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ken Selvia", email = "gotaudio@gmail.com" }
]
requires-python = ">=3.9, <3.12"
dependencies = [
    "opencv-python>=4.7.0",
    "openai==0.28",
    "pyyaml>=6.0",
    "joblib>=1.2.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
abs = "abs:cli"

[project.urls]
Homepage = "https://github.com/GotAudio/AudioBookSlides"
Repository = "https://github.com/GotAudio/AudioBookSlides.git"
